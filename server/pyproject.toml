[project]
name = "pantheon"
version = "0.1.0"
description = "Pantheon server: polls the lab, merges it into one inventory, serves the API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pantheon = "pantheon:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 240

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: the mock datasets are tables, and wrapping them makes them harder to read.
ignore = ["E741", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
