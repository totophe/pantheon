# Pantheon: the web container is the only one exposed; it proxies /api to the server.
services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      # Which integrations serve mock data: "all", "none", or a comma-separated list of ids.
      PANTHEON_MOCK: ${PANTHEON_MOCK:-all}
    # Secrets referenced as ${NAME} in pantheon.toml are read from the server's environment:
    # env_file: .env
    volumes:
      - pantheon-data:/data
      # Connection settings of the live integrations (see server/pantheon.example.toml):
      # - ./pantheon.toml:/data/pantheon.toml:ro

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${PANTHEON_PORT:-8080}:80"

volumes:
  pantheon-data:
